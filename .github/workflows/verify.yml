name: Verify and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.scratch/cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.scratch/cache/pip
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.scratch/cache/pycache

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare scratch directory
        run: mkdir -p .scratch/tmp
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify code, tests, and documentation
        run: make verify
      - name: Verify an isolated wheel installation
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/tmp
        run: |
          .scratch/venv/bin/python -m pip wheel --no-deps --wheel-dir .scratch/wheel .
          .scratch/venv/bin/python -m venv .scratch/wheel-smoke
          .scratch/wheel-smoke/bin/python -m pip install --no-deps .scratch/wheel/*.whl
          .scratch/wheel-smoke/bin/python -m pip check
          .scratch/wheel-smoke/bin/yoke --help
          .scratch/wheel-smoke/bin/yoke-media probe --frames 3

  browser:
    name: Browser / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned browser and its runner dependencies
        run: make browser-install BROWSER_INSTALL_OPTIONS=--with-deps
      - name: Verify the exact Pages artifact in Chromium
        run: make verify-browser
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-python-${{ matrix.python }}
          path: .scratch/browser-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the browser-verified site
        if: matrix.python == '3.12' && github.ref == 'refs/heads/feature/ir' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .scratch/site
          retention-days: 1

  firmware:
    name: ESP32 firmware
    uses: ./.github/workflows/esp32.yml
    permissions:
      contents: read

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/feature/ir' && github.event_name != 'pull_request'
    needs: [verify, browser, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
