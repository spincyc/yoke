# Reference GStreamer HDMI receiver. Requires the media tools described in
# doc/design/MEDIA.md; the agent itself never receives media payload.
node_id = "tv-stream"
role = "consumer"
kind = "hdmi"
name = "Reference HDMI receiver"
psk_file = "/etc/yoke/psk"
state_file = "/var/lib/yoke/state.json"
# Local host address on the control VLAN; change for the installation.
interface = "10.20.30.2"

[driver]
type = "stream"
stop_timeout = 5.0
# The driver supervises process lifecycle. ACTIVE confirms the worker is
# running; it does not independently prove decoded pictures or HDMI output.
