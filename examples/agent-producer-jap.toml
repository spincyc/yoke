# Warden for a Just Add Power encoder on channel 12 (garage camera).
node_id = "cam-garage"
role = "producer"
kind = "hdmi"
name = "Garage camera (JAP TX ch12)"
psk_file = "/etc/yoke/psk"
state_file = "/var/lib/yoke/state.json"
# Set to the warden host's address on the control VLAN when multi-homed.
# interface = "10.20.30.2"

[driver]
type = "jap"
channel = 12
