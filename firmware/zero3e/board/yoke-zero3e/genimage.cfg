# Yoke Radxa ZERO 3E read-only A/B GPT image (~341 MiB total; fits 2 GB+ microSD)

image boot.vfat {
	vfat {
		label = "YOKEBOOT"
		files = {
			"boot.scr"
		}
	}
	size = 4M
}

image data.ext4 {
	ext4 {
		label = "yoke-data"
		use-mke2fs = true
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition uboot-env {
		partition-type-uuid = 3de21764-95bd-54bd-a5c3-4abe786f38a8
		offset = 16M
		size = 64K
	}

	partition yoke-boot {
		partition-type-uuid = c12a7328-f81f-11d2-ba4b-00a0c93ec93b
		image = "boot.vfat"
		offset = 17M
		size = 4M
		bootable = true
	}

	partition yoke-a {
		partition-type-uuid = L
		partition-uuid = 11111111-1111-4111-8111-00000000000a
		image = "rootfs.squashfs"
		size = 128M
	}

	partition yoke-b {
		partition-type-uuid = L
		partition-uuid = 11111111-1111-4111-8111-00000000000b
		image = "rootfs.squashfs"
		size = 128M
	}

	partition yoke-data {
		partition-type-uuid = L
		image = "data.ext4"
		size = 64M
	}
}
