# Run the native gadget worker (ADR 0027) instead of the Python one.
# Installed by `install.sh computer --native-worker PATH`, removed by
# `install.sh computer` without the option. The unit's ExecStart is kept:
# python -m yoke.usb.worker sees $YOKE_GADGET_WORKER and executes
# /usr/local/libexec/yoke/yoke-gadget-worker (its --native-binary default)
# with the same options, so the options, the control socket schema
# (ADR 0022) and the sandbox stay the unit's. See native/README.md.
# ⚠ Raw Gadget on the RK3566 is bench-unverified (doc/design/USB-DATAPATH.md).
[Service]
Environment=YOKE_GADGET_WORKER=native
