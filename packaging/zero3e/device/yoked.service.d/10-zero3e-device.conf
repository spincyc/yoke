# yoked drop-in for the ZERO 3E device-side box (USB peripheral attached).
# Installed by packaging/zero3e/install.sh; see DEPLOYMENT.md and ADR 0024.
#
# The agent stays unprivileged (User=yoke, NoNewPrivileges, no capabilities).
# It only reads sysfs export state, probes the local usbipd, and writes
# admission *requests* into its own runtime directory; root-owned units do
# the binding (yoke-usbip-bind@.service), the daemon (yoke-usbipd.service)
# and the firewall (yoke-usbip-admission.{path,service}).
[Unit]
Wants=yoke-usbipd.service yoke-usbip-admission.path
After=yoke-usbipd.service yoke-usbip-admission.path

[Service]
# /run/yoke/usbip-admission.json lives here. 0755 lets the root helper read
# it without CAP_DAC_OVERRIDE; it holds only the allowlisted addresses.
RuntimeDirectory=yoke
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
