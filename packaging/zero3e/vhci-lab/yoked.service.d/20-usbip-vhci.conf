# yoked drop-in for a lab Linux consumer that imports USB/IP devices into
# its own kernel (vhci-hcd). The product's computer-side box does not use
# this path; its USB gadget worker has its own unit (ADR 0024).
#
# `usbip attach` writes the vhci attach attribute (group-writable for yoke via
# 70-yoke-vhci.rules) and then its connection record under /run/vhci_hcd
# (owned by yoke via tmpfiles). Both must succeed under one identity, or
# every import becomes a record-less RECOVERY_REQUIRED port (ADR 0014).
# ⚠ bench-unverified.
[Unit]
After=systemd-tmpfiles-setup.service

[Service]
ReadWritePaths=/run/vhci_hcd
