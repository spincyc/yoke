[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoke"
version = "0.1.0"
description = "Controllerless pairing of HDMI/USB endpoints over switched Ethernet"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
yoke = "yoke.cli:main"
yoke-media = "yoke.media.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoke"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["yoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
