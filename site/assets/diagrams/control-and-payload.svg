      <path d="M21 64h17v12H21ZM56 64h17v12H56ZM91 64h17v12H91ZM126 64h17v12h-17Z" class="insert"/>
    </g><g transform="translate(660 362) scale(0.8)"><g transform="translate(156 0) scale(-1 1)">
      <path d="m0 18 116-17 40 25-116 17Z" class="top"/>
      <path d="m116 1 40 25v62l-40 15Z" class="side"/>
      <path d="M0 18h116v85H0Z" class="face"/>
      <rect x="12" y="59" width="29" height="16" rx="1" class="port"/>
      <rect x="17" y="64" width="19" height="5" class="insert"/>
      <path d="m133 47 17-7v26l-17 6Z" class="port"/>
