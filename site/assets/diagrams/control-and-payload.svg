<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 711" width="1000" height="711" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Pair the USB boxes with optional setup outside the USB traffic path</title>
  <desc id="diagram-description">USB 2 hardware design. A USB peripheral connects by USB cable to a dedicated device-side Yoke USB box. An Ethernet switch connects it to a second dedicated computer-side Yoke USB box. A second USB cable connects that box to the user’s external computer, whose operating system is unspecified. USB requests and responses travel in both directions. The boxes are hardware appliances; the Radxa ZERO 3E prototype is an engineering path, not a ready-to-ship product. Optional setup sits outside the USB traffic path. A setup tool pairs the two boxes over the Ethernet network and can disconnect after the pairing is saved.</desc>
  <defs>
    <marker id="both" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 2 4 3-4 3" class="arrow"/></marker>
    <style>
      :root {color-scheme:light dark;--paper:#f8f7f4;--ink:#17202a;--muted:#52606c;--rule:#d9dce0;--face:#efede8;--top:#fff;--side:#dfe2e3;--port:#17202a;--insert:#b4bbc0;--blue:#315fcd;--screen:#17202a;--setup:#52606c}
      text {font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
      .canvas {fill:var(--paper)}
      .face {fill:var(--face);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
      .top {fill:var(--top);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
      .side {fill:var(--side);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
      .port {fill:var(--port)}
      .insert {fill:var(--insert)}
      .blue {fill:var(--blue)}
      .screen {fill:var(--screen)}
      .label {font-weight:600;letter-spacing:-.4px}
      .detail {fill:var(--muted)}
      .rule {fill:none;stroke:var(--rule);stroke-width:1}
      .trim {fill:none;stroke:var(--insert);stroke-width:2;stroke-linecap:round}
      .traffic {fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .direction {fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;marker-start:url(#both);marker-end:url(#both)}
      .setup {fill:none;stroke:var(--setup);stroke-width:2;stroke-dasharray:6 6;stroke-linejoin:round}
      .setup-box {fill:var(--paper);stroke:var(--setup);stroke-width:1.6;stroke-dasharray:5 4}
      .arrow {fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      @media (prefers-color-scheme:dark) {
        :root {--paper:#15191f;--ink:#f3f4f6;--muted:#aeb8c7;--rule:#38434f;--face:#303943;--top:#38434f;--side:#242d36;--port:#11161d;--insert:#aeb8c7;--blue:#82a7ff;--screen:#11161d;--setup:#aeb8c7}
      }
    </style>
  </defs>
  <rect width="1000" height="711" class="canvas"/>
  <text x="30" y="39" font-size="24" class="label">PAIR BOXES / USB 2 HARDWARE</text><path d="M30 60H970" class="rule" /><rect x="340" y="87" width="320" height="105" rx="4" class="setup-box"/><text x="500" y="122" font-size="28" class="label" text-anchor="middle">Optional setup</text><text x="500" y="160" font-size="27" class="label" text-anchor="middle">Pair boxes</text><path d="M500 193V235H290V351" class="setup" /><path d="M500 235H710V351" class="setup" /><text x="500" y="273" font-size="23" class="detail" text-anchor="middle">Setup over the Ethernet network</text><path d="M126 418H236" class="traffic" /><path d="M365 418H434" class="traffic" /><path d="M575 418H654" class="traffic" /><path d="M789 418H870" class="traffic" /><path d="M151 418H208" class="direction" /><path d="M381 418H418" class="direction" /><path d="M590 418H638" class="direction" /><path d="M808 418H851" class="direction" /><g transform="translate(25 369) scale(0.64)">
      <path d="M35 10c-15 0-23 10-28 28L-5 80c-4 16 12 25 23 13l19-21h67l19 21c11 12 27 3 23-13l-12-42c-5-18-13-28-28-28Z" class="face"/>
