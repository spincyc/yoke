    </g><g transform="translate(860 367) scale(0.62)">
      <rect x="15" y="0" width="180" height="120" rx="5" class="face"/>
      <rect x="24" y="9" width="162" height="101" rx="1" class="screen"/>
      <path d="m24 110 48-55 34 31 32-20 48 44Z" class="blue" opacity=".85"/>
